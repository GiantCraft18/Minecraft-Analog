<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Clone — Survival</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #000; }
        canvas { display: block; }

        /* HUD */
        #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 20px; height: 20px; transform: translate(-50%, -50%);
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { left: 9px; top: 0; width: 2px; height: 20px; }

        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; padding: 6px;
            background: rgba(0,0,0,0.5); border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(6px);
        }
        .slot {
            width: 52px; height: 52px; border-radius: 6px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; position: relative; transition: all 0.1s;
        }
        .slot .num {
            position: absolute; top: 1px; left: 4px;
            font-size: 9px; color: rgba(255,255,255,0.5); font-weight: bold;
        }
        .slot .count {
            position: absolute; bottom: 2px; right: 4px;
            font-size: 11px; color: #fff; font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .slot.active {
            border-color: #7ec850; background: rgba(126,200,80,0.2);
            box-shadow: 0 0 10px rgba(126,200,80,0.5); transform: scale(1.06);
        }

        #stats {
            position: absolute; top: 12px; left: 12px;
            display: flex; flex-direction: column; gap: 6px;
            color: white; font-size: 12px; text-shadow: 1px 1px 2px #000;
        }
        .bar {
            width: 160px; height: 14px; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 4px;
            overflow: hidden; position: relative;
        }
        .bar .fill {
            height: 100%; transition: width 0.2s;
        }
        .bar.health .fill { background: linear-gradient(90deg, #e74c3c, #ff6b6b); }
        .bar.hunger .fill { background: linear-gradient(90deg, #e67e22, #f39c12); }
        .bar .label {
            position: absolute; inset: 0; display: flex; align-items: center;
            justify-content: center; font-size: 9px; font-weight: bold;
        }

        #info {
            position: absolute; top: 12px; right: 12px;
            color: white; font-size: 11px; text-align: right;
            text-shadow: 1px 1px 2px #000; line-height: 1.5;
        }

        #toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
            padding: 10px 22px; background: rgba(126,200,80,0.95); color: #111;
            border-radius: 8px; font-weight: bold; font-size: 13px;
            opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 150;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Меню */
        .overlay {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
            transition: opacity 0.3s; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .overlay h1 {
            font-size: 52px; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(135deg, #7ec850, #4a9e2a);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; margin-bottom: 8px;
        }
        .overlay .sub { color: #888; font-size: 14px; margin-bottom: 30px; letter-spacing: 3px; }
        .btn {
            padding: 14px 48px; font-size: 17px; font-weight: bold;
            border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, #7ec850, #5a9e3a);
            color: #111; margin: 6px; transition: all 0.15s;
            box-shadow: 0 4px 15px rgba(126,200,80,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(126,200,80,0.5); }
        .btn.secondary {
            background: rgba(255,255,255,0.08); color: #ddd;
            border: 1px solid rgba(255,255,255,0.15); box-shadow: none;
        }
        .btn.secondary:hover { background: rgba(255,255,255,0.15); }

        #pauseMenu h2 { color: white; font-size: 34px; letter-spacing: 4px; margin-bottom: 20px; }

        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0a0a0a;
            z-index: 200; transition: opacity 0.4s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(126,200,80,0.15);
            border-top-color: #7ec850; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { color: #7ec850; letter-spacing: 2px; }

        #hint {
            position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
            color: white; font-size: 12px; background: rgba(0,0,0,0.6);
            padding: 6px 16px; border-radius: 20px; opacity: 0;
            transition: opacity 0.3s; white-space: nowrap;
        }
        #hint.show { opacity: 1; }

        /* Инвентарь */
        #inventory {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 80;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
        }
        #inventory.hidden { display: none; }
        #inventory h3 { color: #7ec850; margin-bottom: 16px; letter-spacing: 2px; }
        .inv-grid {
            display: grid; grid-template-columns: repeat(9, 54px);
            gap: 4px; background: rgba(0,0,0,0.5); padding: 12px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        .inv-slot {
            width: 54px; height: 54px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; position: relative; cursor: pointer;
        }
        .inv-slot:hover { background: rgba(126,200,80,0.15); border-color: rgba(126,200,80,0.4); }
        .inv-slot .count {
            position: absolute; bottom: 2px; right: 4px;
            font-size: 11px; color: #fff; font-weight: bold;
        }

        #craftArea {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 16px; padding: 16px;
            background: rgba(0,0,0,0.4); border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #craftArea .arrow { font-size: 24px; color: #7ec850; }
        .craft-slot {
            width: 50px; height: 50px; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; cursor: pointer;
        }
        .craft-slot:hover { border-color: #7ec850; }

        .craft-grid {
            display: grid; grid-template-columns: repeat(3, 50px); gap: 4px;
        }
        .craft-grid .craft-slot {
            width: 50px; height: 50px;
        }
    </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>ГЕНЕРАЦИЯ МИРА...</p></div>

<div id="hud">
    <div id="crosshair"></div>
    <div id="stats">
        <div class="bar health"><div class="fill" id="healthFill" style="width:100%"></div><div class="label" id="healthLabel">20/20</div></div>
        <div class="bar hunger"><div class="fill" id="hungerFill" style="width:100%"></div><div class="label" id="hungerLabel">20/20</div></div>
    </div>
    <div id="info">
        <div id="infoCoords">X:0 Y:0 Z:0</div>
        <div id="infoTime">День</div>
        <div id="infoFps">FPS: 0</div>
    </div>
    <div id="hotbar"></div>
    <div id="hint"></div>
</div>

<!-- Инвентарь / Крафт -->
<div id="inventory" class="hidden">
    <h3>КРАФТ</h3>
    <div id="craftArea">
        <div class="craft-grid" id="craftGrid"></div>
        <div class="arrow">→</div>
        <div class="craft-slot" id="craftResult" title="Результат"></div>
    </div>
    <h3>ИНВЕНТАРЬ</h3>
    <div class="inv-grid" id="invGrid"></div>
    <p style="color:#888;font-size:12px;margin-top:12px;">E — закрыть</p>
</div>

<!-- Главное меню -->
<div id="mainMenu" class="overlay">
    <h1>MINECRAFT</h1>
    <p class="sub">SURVIVAL CLONE</p>
    <button class="btn" id="playBtn">ИГРАТЬ</button>
</div>

<!-- Пауза -->
<div id="pauseMenu" class="overlay hidden">
    <h2>ПАУЗА</h2>
    <button class="btn" id="resumeBtn">ПРОДОЛЖИТЬ</button>
    <button class="btn secondary" id="saveBtn">СОХРАНИТЬ</button>
    <button class="btn secondary" id="menuBtn">В МЕНЮ</button>
</div>

<div id="toast"></div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// КОНСТАНТЫ
// ============================================================
const BLOCK_TYPES = {
    grass:   { name: 'Трава',  icon: '🌿', hardness: 0.6, tool: null, drop: 'grass' },
    dirt:    { name: 'Земля',  icon: '🟫', hardness: 0.5, tool: null, drop: 'dirt' },
    stone:   { name: 'Камень', icon: '🪨', hardness: 1.5, tool: 'pickaxe', drop: 'stone' },
    wood:    { name: 'Дерево', icon: '🪵', hardness: 2.0, tool: 'axe', drop: 'wood' },
    leaves:  { name: 'Листва', icon: '🍃', hardness: 0.2, tool: null, drop: null },
    plank:   { name: 'Доски',  icon: '🟧', hardness: 2.0, tool: 'axe', drop: 'plank' },
    cobble:  { name: 'Булыжник', icon: '🧱', hardness: 2.0, tool: 'pickaxe', drop: 'cobble' },
    coal_ore:{ name: 'Уголь',  icon: '⬛', hardness: 3.0, tool: 'pickaxe', drop: 'coal' },
    iron_ore:{ name: 'Железо', icon: '🟤', hardness: 3.0, tool: 'pickaxe', drop: 'iron_ore' },
    sand:    { name: 'Песок',  icon: '🟨', hardness: 0.5, tool: null, drop: 'sand' },
    cactus:  { name: 'Кактус', icon: '🌵', hardness: 0.4, tool: null, drop: 'cactus' },
};

const ITEMS = {
    grass:   { name: 'Трава',  icon: '🌿', stack: 64 },
    dirt:    { name: 'Земля',  icon: '🟫', stack: 64 },
    stone:   { name: 'Камень', icon: '🪨', stack: 64 },
    wood:    { name: 'Дерево', icon: '🪵', stack: 64 },
    plank:   { name: 'Доски',  icon: '🟧', stack: 64 },
    cobble:  { name: 'Булыжник', icon: '🧱', stack: 64 },
    coal:    { name: 'Уголь',  icon: '⬛', stack: 64 },
    iron_ore:{ name: 'Железная руда', icon: '🟤', stack: 64 },
    sand:    { name: 'Песок',  icon: '🟨', stack: 64 },
    cactus:  { name: 'Кактус', icon: '🌵', stack: 64 },
    stick:   { name: 'Палка',  icon: '🥢', stack: 64 },
    wood_pickaxe: { name: 'Деревянная кирка', icon: '⛏️', stack: 1, tool: 'pickaxe', tier: 1 },
    stone_pickaxe:{ name: 'Каменная кирка', icon: '⛏️', stack: 1, tool: 'pickaxe', tier: 2 },
    wood_axe:    { name: 'Деревянный топор', icon: '🪓', stack: 1, tool: 'axe', tier: 1 },
    stone_axe:   { name: 'Каменный топор', icon: '🪓', stack: 1, tool: 'axe', tier: 2 },
};

// Рецепты крафта (упрощённые, без сетки — просто набор ингредиентов)
const RECIPES = [
    { out: 'plank', count: 4, need: { wood: 1 } },
    { out: 'stick', count: 4, need: { plank: 2 } },
    { out: 'wood_pickaxe', count: 1, need: { plank: 3, stick: 2 } },
    { out: 'stone_pickaxe', count: 1, need: { cobble: 3, stick: 2 } },
    { out: 'wood_axe', count: 1, need: { plank: 3, stick: 2 } },
    { out: 'stone_axe', count: 1, need: { cobble: 3, stick: 2 } },
];

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
    running: false,
    paused: false,
    locked: false,
    currentSlot: 0,
    health: 20,
    maxHealth: 20,
    hunger: 20,
    maxHunger: 20,
    time: 0, // игровое время (день/ночь)
    dayLength: 600, // секунд на полный цикл
    inv: {}, // id -> count
    hotbar: ['grass', 'dirt', 'stone', 'wood', 'plank', 'cobble', 'coal', 'sand', 'cactus'],
    mining: null,
    miningProgress: 0,
    lastFpsUpdate: 0,
    fps: 0,
    frameCount: 0,
    frameTime: 0,
};

// ============================================================
// THREE.JS
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 40, 120);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Свет
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff5e0, 1.0);
sun.position.set(60, 100, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
sun.shadow.camera.far = 300;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x87CEEB, 0x3a5a2a, 0.4);
scene.add(hemi);

// ============================================================
// ТЕКСТУРЫ
// ============================================================
function tex(draw, size = 64) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestMipmapNearestFilter;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
}
function noise(ctx, s, colors, n = 400) {
    for (let i = 0; i < n; i++) {
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.fillRect(Math.random() * s, Math.random() * s, 2 + Math.random() * 3, 2 + Math.random() * 3);
    }
}
const texGrassTop = tex((c, s) => { c.fillStyle = '#5a9e3a'; c.fillRect(0,0,s,s); noise(c,s,['#4a8e2a','#6aae4a','#68b83a'],500); });
const texDirt = tex((c, s) => { c.fillStyle = '#8B5A2B'; c.fillRect(0,0,s,s); noise(c,s,['#7a4a1b','#9b6a3b','#6a3a0b'],500); });
const texGrassSide = tex((c, s) => {
    c.fillStyle = '#8B5A2B'; c.fillRect(0,0,s,s); noise(c,s,['#7a4a1b','#9b6a3b'],400);
    c.fillStyle = '#5a9e3a'; c.fillRect(0,0,s,s*0.22);
    noise(c,s,['#4a8e2a','#6aae4a'],80);
});
const texStone = tex((c, s) => { c.fillStyle = '#888'; c.fillRect(0,0,s,s); noise(c,s,['#777','#999','#6a6a6a','#a0a0a0'],600); });
const texWood = tex((c, s) => {
    c.fillStyle = '#6b4a2b'; c.fillRect(0,0,s,s);
    for (let i = 0; i < 12; i++) {
        c.strokeStyle = Math.random() > 0.5 ? '#5a3a1b' : '#7b5a3b';
        c.lineWidth = 1 + Math.random() * 2;
        c.beginPath(); c.moveTo(0, Math.random()*s); c.lineTo(s, Math.random()*s); c.stroke();
    }
});
const texLeaves = tex((c, s) => { c.fillStyle = '#2d6e1e'; c.fillRect(0,0,s,s); noise(c,s,['#1d5e0e','#3d8e2e','#4a9e3a'],700); });
const texPlank = tex((c, s) => {
    c.fillStyle = '#b08050'; c.fillRect(0,0,s,s);
    for (let y = 0; y < s; y += 16) { c.strokeStyle = '#8a6030'; c.lineWidth = 2; c.beginPath(); c.moveTo(0,y); c.lineTo(s,y); c.stroke(); }
    noise(c,s,['#a07040','#c09060'],150);
});
const texCobble = tex((c, s) => { c.fillStyle = '#777'; c.fillRect(0,0,s,s); noise(c,s,['#666','#888','#555','#999'],800); });
const texCoalOre = tex((c, s) => {
    c.fillStyle = '#888'; c.fillRect(0,0,s,s); noise(c,s,['#777','#999'],300);
    for (let i = 0; i < 20; i++) { c.fillStyle = '#222'; c.beginPath(); c.arc(Math.random()*s, Math.random()*s, 2+Math.random()*3, 0, Math.PI*2); c.fill(); }
});
const texIronOre = tex((c, s) => {
    c.fillStyle = '#888'; c.fillRect(0,0,s,s); noise(c,s,['#777','#999'],300);
    for (let i = 0; i < 15; i++) { c.fillStyle = '#c08050'; c.beginPath(); c.arc(Math.random()*s, Math.random()*s, 2+Math.random()*3, 0, Math.PI*2); c.fill(); }
});
const texSand = tex((c, s) => { c.fillStyle = '#d4c48a'; c.fillRect(0,0,s,s); noise(c,s,['#c4b47a','#e4d49a','#b4a46a'],400); });
const texCactus = tex((c, s) => { c.fillStyle = '#2d7a2d'; c.fillRect(0,0,s,s); noise(c,s,['#1d6a1d','#3d8a3d','#4a9a4a'],300); });

const mats = {
    grass: [new THREE.MeshLambertMaterial({ map: texGrassSide }), new THREE.MeshLambertMaterial({ map: texGrassSide }), new THREE.MeshLambertMaterial({ map: texGrassTop }), new THREE.MeshLambertMaterial({ map: texDirt }), new THREE.MeshLambertMaterial({ map: texGrassSide }), new THREE.MeshLambertMaterial({ map: texGrassSide })],
    dirt: new THREE.MeshLambertMaterial({ map: texDirt }),
    stone: new THREE.MeshLambertMaterial({ map: texStone }),
    wood: new THREE.MeshLambertMaterial({ map: texWood }),
    leaves: new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, opacity: 0.92 }),
    plank: new THREE.MeshLambertMaterial({ map: texPlank }),
    cobble: new THREE.MeshLambertMaterial({ map: texCobble }),
    coal_ore: new THREE.MeshLambertMaterial({ map: texCoalOre }),
    iron_ore: new THREE.MeshLambertMaterial({ map: texIronOre }),
    sand: new THREE.MeshLambertMaterial({ map: texSand }),
    cactus: new THREE.MeshLambertMaterial({ map: texCactus }),
};

// ============================================================
// МИР
// ============================================================
const WORLD_SIZE = 32;
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const world = new Map(); // "x|y|z" -> { mesh, type }
const k = (x, y, z) => `${x}|${y}|${z}`;

function addBlock(x, y, z, type) {
    const key = k(x, y, z);
    if (world.has(key)) return false;
    const m = mats[type] || mats.stone;
    const mesh = new THREE.Mesh(blockGeo, m);
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData = { type, x, y, z };
    scene.add(mesh);
    world.set(key, { mesh, type });
    return true;
}

function removeBlock(x, y, z) {
    const key = k(x, y, z);
    const b = world.get(key);
    if (!b) return null;
    scene.remove(b.mesh);
    world.delete(key);
    return b.type;
}

function getBlock(x, y, z) {
    return world.get(k(x, y, z));
}

// Генерация
function hash(x, z, seed = 1) {
    let h = Math.sin(x * 127.1 * seed + z * 311.7) * 43758.5453;
    return h - Math.floor(h);
}

function generateWorld() {
    for (const b of world.values()) scene.remove(b.mesh);
    world.clear();

    const seed = Math.random() * 1000;

    for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x++) {
        for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z++) {
            const n1 = Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2;
            const n2 = Math.sin((x+z) * 0.12) * 2.5;
            const n3 = hash(x, z, seed) * 1.5;
            let h = Math.floor(3 + n1 + n2 + n3);
            h = Math.max(1, Math.min(10, h));

            // Биом: песок у "воды" (низко), трава обычно, камень высоко
            const isDesert = hash(x*2.1, z*2.3, seed) > 0.85 && h < 5;
            const isMountain = h > 7;

            for (let y = 0; y < h; y++) {
                let type = 'stone';
                if (y === h - 1) {
                    if (isDesert) type = 'sand';
                    else if (isMountain) type = 'stone';
                    else type = 'grass';
                } else if (y >= h - 3) {
                    type = isDesert ? 'sand' : 'dirt';
                } else {
                    // Руды
                    const r = hash(x*5.1, z*7.3 + y*11, seed);
                    if (r > 0.95) type = 'coal_ore';
                    else if (r > 0.92) type = 'iron_ore';
                }
                addBlock(x, y, z, type);
            }

            // Деревья
            if (!isDesert && !isMountain && h >= 2 && hash(x*3.3, z*5.7, seed) > 0.87) {
                const th = 4 + Math.floor(hash(x, z, seed) * 3);
                for (let ty = 1; ty <= th; ty++) addBlock(x, h - 1 + ty, z, 'wood');
                const lb = h + th - 2;
                for (let lx = -2; lx <= 2; lx++)
                    for (let lz = -2; lz <= 2; lz++)
                        for (let ly = 0; ly <= 2; ly++) {
                            const d = Math.abs(lx) + Math.abs(lz) + ly;
                            if (d <= 3 && !(lx === 0 && lz === 0 && ly < 2) && Math.random() > 0.2)
                                addBlock(x+lx, lb+ly, z+lz, 'leaves');
                        }
            }
            // Кактусы
            if (isDesert && h >= 2 && hash(x*7.7, z*9.1, seed) > 0.92) {
                addBlock(x, h, z, 'cactus');
            }
        }
    }
}

// ============================================================
// ИГРОК
// ============================================================
const player = {
    pos: new THREE.Vector3(0, 12, 0),
    vel: new THREE.Vector3(),
    yaw: 0,
    pitch: 0,
    height: 1.7,
    onGround: false,
};

const GRAVITY = -0.018;
const JUMP = 0.3;
const WALK_SPEED = 0.12;

function getGroundY(x, z) {
    const ix = Math.round(x), iz = Math.round(z);
    for (let y = 20; y >= -5; y--) {
        if (getBlock(ix, y, iz)) return y + 1;
    }
    return 0;
}

// ============================================================
// ВВОД
// ============================================================
const keys = {};

addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Escape') {
        if (state.running && !state.paused) pause();
    }
    if (e.code === 'KeyE') {
        if (state.running && !state.paused) toggleInventory();
    }
    const n = parseInt(e.key);
    if (n >= 1 && n <= 9) {
        state.currentSlot = n - 1;
        updateHotbar();
    }
});
addEventListener('keyup', e => keys[e.code] = false);

addEventListener('mousemove', e => {
    if (!state.locked) return;
    const s = 0.002;
    player.yaw -= e.movementX * s;
    player.pitch -= e.movementY * s;
    player.pitch = Math.max(-Math.PI/2 + 0.01, Math.min(Math.PI/2 - 0.01, player.pitch));
});

// Клики
addEventListener('mousedown', e => {
    if (!state.locked) return;
    const hit = raycastBlock();
    if (!hit) return;

    if (e.button === 0) {
        // Начать добычу
        const p = hit.block.userData;
        const bt = BLOCK_TYPES[p.type];
        if (!bt) return;

        // Проверка инструмента
        const tool = getCurrentTool();
        let speed = 1;
        if (tool && bt.tool && tool.tool === bt.tool) speed = tool.tier + 1;
        else if (bt.tool && (!tool || tool.tool !== bt.tool)) speed = 0.3; // медленно без инструмента

        state.mining = { x: p.x, y: p.y, z: p.z, type: p.type, speed, elapsed: 0, need: bt.hardness / speed };
        state.miningProgress = 0;
    } else if (e.button === 2) {
        // Поставить блок
        const p = hit.block.userData;
        const n = hit.normal;
        const nx = p.x + n.x, ny = p.y + n.y, nz = p.z + n.z;

        // Не ставить в себя
        if (Math.abs(nx - player.pos.x) < 0.8 && Math.abs(nz - player.pos.z) < 0.8 &&
            ny > player.pos.y - 1.5 && ny < player.pos.y + 0.5) return;

        const item = state.hotbar[state.currentSlot];
        if (item && (state.inv[item] || 0) > 0) {
            if (addBlock(nx, ny, nz, item)) {
                state.inv[item]--;
                if (state.inv[item] <= 0) delete state.inv[item];
                updateHotbar();
                showHint('Поставлено: ' + ITEMS[item].name);
            }
        }
    }
});

addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// РЕЙКАСТ
// ============================================================
const raycaster = new THREE.Raycaster();
raycaster.far = 6;

function raycastBlock() {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const meshes = [...world.values()].map(b => b.mesh);
    const hits = raycaster.intersectObjects(meshes, false);
    if (hits.length === 0) return null;
    return { block: hits[0].object, normal: hits[0].face.normal.clone() };
}

// ============================================================
// ИНВЕНТАРЬ / КРАФТ
// ============================================================
const invGrid = document.getElementById('invGrid');
const craftGrid = document.getElementById('craftGrid');
const craftResult = document.getElementById('craftResult');
const inventoryEl = document.getElementById('inventory');

function addItem(id, count = 1) {
    state.inv[id] = (state.inv[id] || 0) + count;
    updateHotbar();
}

function removeItem(id, count = 1) {
    if (!state.inv[id]) return false;
    state.inv[id] -= count;
    if (state.inv[id] <= 0) delete state.inv[id];
    updateHotbar();
    return true;
}

function getCurrentTool() {
    const item = state.hotbar[state.currentSlot];
    if (item && ITEMS[item] && ITEMS[item].tool) return ITEMS[item];
    return null;
}

function updateHotbar() {
    const hb = document.getElementById('hotbar');
    hb.innerHTML = '';
    state.hotbar.forEach((id, i) => {
        const d = document.createElement('div');
        d.className = 'slot' + (i === state.currentSlot ? ' active' : '');
        const item = ITEMS[id];
        d.innerHTML = `<span class="num">${i+1}</span>${item ? item.icon : '?'}`;
        const cnt = state.inv[id] || 0;
        if (cnt > 1) d.innerHTML += `<span class="count">${cnt}</span>`;
        d.onclick = () => { state.currentSlot = i; updateHotbar(); };
        hb.appendChild(d);
    });
}

function toggleInventory() {
    if (inventoryEl.classList.contains('hidden')) {
        inventoryEl.classList.remove('hidden');
        document.exitPointerLock();
        renderInventory();
    } else {
        inventoryEl.classList.add('hidden');
        renderer.domElement.requestPointerLock();
    }
}

function renderInventory() {
    invGrid.innerHTML = '';
    // Все предметы в инвентаре
    for (const [id, count] of Object.entries(state.inv)) {
        if (count <= 0) continue;
        const item = ITEMS[id];
        if (!item) continue;
        const d = document.createElement('div');
        d.className = 'inv-slot';
        d.innerHTML = item.icon + (count > 1 ? `<span class="count">${count}</span>` : '');
        d.title = item.name + ' x' + count;
        d.onclick = () => {
            // Добавить в хотбар если возможно
            const free = state.hotbar.findIndex(h => h === id || !state.inv[h]);
            if (free >= 0) state.hotbar[free] = id;
            else state.hotbar[state.currentSlot] = id;
            updateHotbar();
        };
        invGrid.appendChild(d);
    }

    // Крафт: показываем доступные рецепты
    craftGrid.innerHTML = '';
    let craftable = RECIPES.filter(r => {
        for (const [need, cnt] of Object.entries(r.need)) {
            if ((state.inv[need] || 0) < cnt) return false;
        }
        return true;
    });

    // Показать первые 9 доступных или просто пустые слоты
    for (let i = 0; i < 9; i++) {
        const d = document.createElement('div');
        d.className = 'craft-slot';
        if (craftable[i]) {
            const r = craftable[i];
            const outItem = ITEMS[r.out];
            d.innerHTML = outItem.icon + (r.count > 1 ? `<span class="count">${r.count}</span>` : '');
            d.title = outItem.name + ' (из ' + Object.entries(r.need).map(([n,c]) => ITEMS[n].name + 'x'+c).join(', ') + ')';
            d.onclick = () => {
                // Проверить и списать
                for (const [need, cnt] of Object.entries(r.need)) {
                    if ((state.inv[need] || 0) < cnt) return;
                }
                for (const [need, cnt] of Object.entries(r.need)) removeItem(need, cnt);
                addItem(r.out, r.count);
                showHint('Скрафчено: ' + outItem.name + ' x' + r.count);
                renderInventory();
            };
        }
        craftGrid.appendChild(d);
    }
}

// ============================================================
// HUD
// ============================================================
const healthFill = document.getElementById('healthFill');
const healthLabel = document.getElementById('healthLabel');
const hungerFill = document.getElementById('hungerFill');
const hungerLabel = document.getElementById('hungerLabel');
const infoCoords = document.getElementById('infoCoords');
const infoTime = document.getElementById('infoTime');
const infoFps = document.getElementById('infoFps');
const hintEl = document.getElementById('hint');

let hintTimer = null;
function showHint(text) {
    hintEl.textContent = text;
    hintEl.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintEl.classList.remove('show'), 1200);
}

function updateHUD() {
    healthFill.style.width = (state.health / state.maxHealth * 100) + '%';
    healthLabel.textContent = `${Math.ceil(state.health)}/${state.maxHealth}`;
    hungerFill.style.width = (state.hunger / state.maxHunger * 100) + '%';
    hungerLabel.textContent = `${Math.ceil(state.hunger)}/${state.maxHunger}`;

    infoCoords.textContent = `X:${player.pos.x.toFixed(0)} Y:${player.pos.y.toFixed(0)} Z:${player.pos.z.toFixed(0)}`;
    const dayProgress = (state.time % state.dayLength) / state.dayLength;
    infoTime.textContent = dayProgress < 0.5 ? '☀️ День' : '🌙 Ночь';
    infoFps.textContent = 'FPS: ' + state.fps;
}

// ============================================================
// МЕНЮ
// ============================================================
const mainMenu = document.getElementById('mainMenu');
const pauseMenu = document.getElementById('pauseMenu');
const loading = document.getElementById('loading');
const toastEl = document.getElementById('toast');

function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function startGame() {
    mainMenu.classList.add('hidden');
    pauseMenu.classList.add('hidden');
    state.running = true;
    state.paused = false;
    renderer.domElement.requestPointerLock();
}

function pause() {
    state.paused = true;
    pauseMenu.classList.remove('hidden');
    if (document.pointerLockElement) document.exitPointerLock();
}

function resume() {
    pauseMenu.classList.add('hidden');
    state.paused = false;
    renderer.domElement.requestPointerLock();
}

function saveGame() {
    const data = {
        player: { x: player.pos.x, y: player.pos.y, z: player.pos.z, yaw: player.yaw, pitch: player.pitch },
        health: state.health, hunger: state.hunger, time: state.time,
        inv: state.inv, hotbar: state.hotbar,
        blocks: [...world.entries()].map(([key, b]) => ({ key, type: b.type })),
    };
    localStorage.setItem('mc_clone_save', JSON.stringify(data));
    showToast('💾 Игра сохранена');
}

function loadGame() {
    const raw = localStorage.getItem('mc_clone_save');
    if (!raw) return false;
    try {
        const data = JSON.parse(raw);
        for (const b of world.values()) scene.remove(b.mesh);
        world.clear();
        for (const { key, type } of data.blocks) {
            const [x, y, z] = key.split('|').map(Number);
            addBlock(x, y, z, type);
        }
        player.pos.set(data.player.x, data.player.y, data.player.z);
        player.yaw = data.player.yaw;
        player.pitch = data.player.pitch;
        state.health = data.health;
        state.hunger = data.hunger;
        state.time = data.time;
        state.inv = data.inv || {};
        state.hotbar = data.hotbar || state.hotbar;
        updateHotbar();
        return true;
    } catch (e) { return false; }
}

document.getElementById('playBtn').onclick = () => {
    if (!loadGame()) {
        generateWorld();
        player.pos.set(0, getGroundY(0, 0) + player.height + 1, 0);
        // Стартовый инвентарь
        state.inv = {};
        addItem('wood', 10);
        addItem('plank', 8);
        addItem('cobble', 12);
        addItem('coal', 4);
        addItem('stick', 6);
    }
    startGame();
};

document.getElementById('resumeBtn').onclick = resume;
document.getElementById('saveBtn').onclick = saveGame;
document.getElementById('menuBtn').onclick = () => {
    state.running = false;
    pauseMenu.classList.add('hidden');
    mainMenu.classList.remove('hidden');
    if (document.pointerLockElement) document.exitPointerLock();
};

document.addEventListener('pointerlockchange', () => {
    state.locked = document.pointerLockElement === renderer.domElement;
    if (!state.locked && state.running && !state.paused && inventoryEl.classList.contains('hidden')) {
        pause();
    }
});

// ============================================================
// МОБЫ (простые зомби)
// ============================================================
const mobs = [];
const mobGeo = new THREE.BoxGeometry(0.6, 1.8, 0.6);
const mobMat = new THREE.MeshLambertMaterial({ color: 0x2d7a2d });

function spawnZombie(x, z) {
    const mesh = new THREE.Mesh(mobGeo, mobMat);
    mesh.position.set(x, getGroundY(x, z) + 0.9, z);
    mesh.castShadow = true;
    scene.add(mesh);
    mobs.push({ mesh, hp: 20, speed: 0.02, target: player.pos.clone() });
}

function updateMobs(dt) {
    for (let i = mobs.length - 1; i >= 0; i--) {
        const m = mobs[i];
        const dx = player.pos.x - m.mesh.position.x;
        const dz = player.pos.z - m.mesh.position.z;
        const dist = Math.hypot(dx, dz);

        if (dist < 30 && dist > 0.8) {
            m.mesh.position.x += (dx / dist) * m.speed * dt;
            m.mesh.position.z += (dz / dist) * m.speed * dt;
        } else if (dist <= 0.8) {
            // Атака
            if (Math.random() < 0.02) {
                state.health -= 2;
                if (state.health <= 0) {
                    showToast('💀 Вы погибли! Возврат на спавн...');
                    state.health = 20;
                    state.hunger = 20;
                    player.pos.set(0, getGroundY(0, 0) + player.height + 1, 0);
                }
            }
        }

        // Гравитация
        const groundY = getGroundY(m.mesh.position.x, m.mesh.position.z) + 0.9;
        if (m.mesh.position.y > groundY) m.mesh.position.y -= 0.05;
        else m.mesh.position.y = groundY;
    }
}

// Спавн ночью
let spawnTimer = 0;
function trySpawnMobs(dt) {
    const dayProgress = (state.time % state.dayLength) / state.dayLength;
    if (dayProgress > 0.5) {
        spawnTimer += dt;
        if (spawnTimer > 200 && mobs.length < 6) {
            spawnTimer = 0;
            const angle = Math.random() * Math.PI * 2;
            const r = 15 + Math.random() * 10;
            const x = player.pos.x + Math.cos(angle) * r;
            const z = player.pos.z + Math.sin(angle) * r;
            if (Math.abs(x) < WORLD_SIZE/2 && Math.abs(z) < WORLD_SIZE/2) {
                spawnZombie(x, z);
            }
        }
    }
}

// ============================================================
// ФИЗИКА И ЦИКЛ
// ============================================================
const clock = new THREE.Clock();

function updatePlayer(dt) {
    const speed = WALK_SPEED * dt;

    const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(forward);
    if (keys['KeyS']) move.sub(forward);
    if (keys['KeyA']) move.sub(right);
    if (keys['KeyD']) move.add(right);

    if (move.length() > 0) {
        move.normalize();
        player.pos.x += move.x * speed;
        player.pos.z += move.z * speed;
        // Голод от ходьбы
        state.hunger -= 0.002 * dt;
    }

    // Прыжок
    const groundY = getGroundY(player.pos.x, player.pos.z) + player.height;
    if (keys['Space'] && player.pos.y <= groundY + 0.1) {
        player.vel.y = JUMP * dt;
        state.hunger -= 0.01 * dt;
    }
    if (keys['ShiftLeft'] || keys['ShiftRight']) {
        player.pos.y -= 0.06 * dt;
    }

    // Гравитация
    player.vel.y += GRAVITY * dt;
    player.pos.y += player.vel.y;

    if (player.pos.y < groundY) {
        player.pos.y = groundY;
        player.vel.y = 0;
    }

    // Мир
    const lim = WORLD_SIZE/2 - 1.5;
    player.pos.x = Math.max(-lim, Math.min(lim, player.pos.x));
    player.pos.z = Math.max(-lim, Math.min(lim, player.pos.z));

    // Голод и здоровье
    state.hunger = Math.max(0, Math.min(state.maxHunger, state.hunger));
    if (state.hunger <= 0) {
        state.health -= 0.01 * dt;
    } else if (state.hunger > 15 && state.health < state.maxHealth) {
        state.health += 0.005 * dt;
    }
    state.health = Math.max(0, Math.min(state.maxHealth, state.health));

    // Падение в бездну
    if (player.pos.y < -10) {
        player.pos.set(0, getGroundY(0,0) + player.height + 1, 0);
        state.health -= 4;
        if (state.health <= 0) { state.health = 20; state.hunger = 20; }
    }

    camera.position.copy(player.pos);
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;
}

// Добыча блоков
function updateMining(dt) {
    if (!state.mining) return;
    const m = state.mining;
    m.elapsed += dt * 0.016;

    state.miningProgress = Math.min(1, m.elapsed / m.need);

    // Визуальная обратная связь
    if (state.miningProgress >= 1) {
        const removed = removeBlock(m.x, m.y, m.z);
        if (removed) {
            const bt = BLOCK_TYPES[removed];
            if (bt && bt.drop) {
                addItem(bt.drop, 1);
                showHint('Получено: ' + (ITEMS[bt.drop]?.name || bt.drop));
            }
        }
        state.mining = null;
        state.miningProgress = 0;
    }
}

// День/ночь
function updateDayNight(dt) {
    state.time += dt;
    const p = (state.time % state.dayLength) / state.dayLength;
    // Солнце вращается
    const angle = p * Math.PI * 2 - Math.PI / 2;
    sun.position.set(Math.cos(angle) * 100, Math.sin(angle) * 100, 40);

    const brightness = Math.max(0.15, Math.sin(p * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5);
    ambient.intensity = 0.2 + brightness * 0.4;
    sun.intensity = 0.2 + brightness * 0.9;

    const skyColor = new THREE.Color().setHSL(0.58, 0.6, 0.3 + brightness * 0.4);
    scene.background = skyColor;
    scene.fog.color = skyColor;
}

let fpsAcc = 0, fpsCount = 0, fpsTimer = 0;

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.1);
    const dt = delta * 60;

    // FPS
    fpsAcc += delta; fpsCount++; fpsTimer += delta;
    if (fpsTimer >= 0.5) {
        state.fps = Math.round(fpsCount / fpsAcc);
        fpsAcc = 0; fpsCount = 0; fpsTimer = 0;
    }

    if (state.running && !state.paused) {
        updatePlayer(dt);
        updateMining(dt);
        updateMobs(dt);
        trySpawnMobs(dt);
        updateDayNight(dt * 0.016);
    }

    updateHUD();
    renderer.render(scene, camera);
}

addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// СТАРТ
// ============================================================
updateHotbar();
setTimeout(() => {
    generateWorld();
    player.pos.set(0, getGroundY(0, 0) + player.height + 1, 0);
    loading.classList.add('hidden');
    animate();
}, 500);

// Автосохранение каждые 30 сек
setInterval(() => {
    if (state.running && !state.paused) saveGame();
}, 30000);

</script>
